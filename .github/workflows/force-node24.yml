name: Force Node.js 24 for JavaScript Actions

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: |
          node --version
          echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=${{ env.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 }}"
